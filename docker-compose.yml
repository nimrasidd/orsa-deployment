services:
  backend:
    build:
      context: ./backend
    env_file:
      # Docker backend config (connects to external Postgres)
      - ./backend/.env.docker
    volumes:
      # DEBUG MODE: write backend NDJSON logs to host workspace file
      - ./debug-3036ca.log:/app/debug-3036ca.log
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      # Ensure Vite dev-server proxy reaches the backend container (not localhost in the container).
      - VITE_API_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend