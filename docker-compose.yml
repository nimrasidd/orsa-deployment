services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: osra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - osra_pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osra"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/osra
      CORS_ORIGINS: http://localhost:5173
      # keep your existing values if you need them in the backend:
      # SUPABASE_URL: ...
      # SUPABASE_PUBLISHABLE_DEFAULT_KEY: ...
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  osra_pgdata: