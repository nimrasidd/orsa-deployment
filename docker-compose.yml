# Local development only. On Linux server use: docker compose -f docker-compose.prod.yml up -d
version: "3.3"

services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=orsa_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=abc123
    volumes:
      - solvency_pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    env_file:
      # Docker backend config (connects to Postgres in this compose file)
      - ./backend/.env.docker
    volumes:
      # DEBUG MODE: write backend NDJSON logs to host workspace file
      - ./debug-3036ca.log:/app/debug-3036ca.log
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    environment:
      # Ensure Vite dev-server proxy reaches the backend container (not localhost in the container).
      - VITE_API_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  solvency_pg_data: