# Production stack for Linux server.
# Fixed ports: frontend 5174, backend 8001 (alongside dev stack on 5173/8000).
#
# Shares the SAME Postgres as docker-compose.yml (5173):
# - Keep the 5173 stack running (it owns the `db` service + data volume).
# - This file does NOT start a second Postgres; backend joins network `osraui_default`.
#
# Usage:
#   docker compose up -d --build                    # 5173 + db (orsa_db)
#   docker compose -f docker-compose.prod.yml up -d --build   # 5174 + 8001

version: "3.3"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8001:8000"
    networks:
      - osraui_shared

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - osraui_shared

networks:
  osraui_shared:
    external: true
    name: osraui_default
