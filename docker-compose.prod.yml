# Production stack for Linux server (self-contained: db + backend + frontend).
# Fixed ports: frontend 5174, backend 8001. Postgres is internal only (no host 5432).
# Uses volume solvency_pg_data (same name as docker-compose.yml) so migrated data is kept.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

version: "3.3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orsa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
    volumes:
      - solvency_pg_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  solvency_pg_data:
