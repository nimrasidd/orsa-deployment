# Production stack for Linux server.
# Fixed ports: frontend 5174, backend 8001 (alongside dev stack on 5173/8000).
#
# Shares the SAME Postgres as ~/orsa-solvency (5173/8000):
# - Keep the old stack running (it owns `db` + the data volume).
# - This file does NOT start Postgres; backend joins the old compose network.
# - Default network: orsa-solvency_default (override: SHARED_DOCKER_NETWORK=my_net)
#
# Usage:
#   docker compose up -d --build                    # 5173 + db (orsa_db)
#   docker compose -f docker-compose.prod.yml up -d --build   # 5174 + 8001

version: "3.3"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8001:8000"
    networks:
      - osraui_shared

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - osraui_shared

networks:
  osraui_shared:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-orsa-solvency_default}
