# Production stack for Linux server.
# Fixed ports: frontend 5174, backend 8001 (alongside old deploy on 5173/8000).
# Works with docker-compose v1 and "docker compose" v2.
#
# Usage: docker-compose -f docker-compose.prod.yml up -d --build
#    or: docker compose -f docker-compose.prod.yml up -d --build

version: "3.3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
    volumes:
      - solvency_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  solvency_pg_data:
