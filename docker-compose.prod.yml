# Production stack for Linux server (~/osra-app).
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# - Built React app + nginx (not Vite dev server)
# - Postgres not exposed on the host (internal network only)
# - restart: unless-stopped
# - No debug log volume mount

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
    volumes:
      - solvency_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      # Host 5173 → nginx 80 (keeps same URL habit as dev deploy)
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  solvency_pg_data:
